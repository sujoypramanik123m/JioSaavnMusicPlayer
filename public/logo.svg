<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>

  <!-- Circle background with Emerald to Teal Gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#emeraldTeal)" />

  <!-- Inner music note and sound wave equalizer bars -->
  <g fill="url(#iconGlow)">
    <!-- Sound wave bars (Left) -->
    <rect x="90" y="216" width="18" height="80" rx="9" />
    <rect x="122" y="171" width="18" height="170" rx="9" opacity="0.9" />
    <rect x="154" y="141" width="18" height="230" rx="9" opacity="0.95" />

    <!-- Music Note (Center) -->
    <!-- Connecting Beam at top -->
    <path d="M 218 135 L 324 105 C 328 104 332 107 332 111 L 332 145 L 218 175 Z" />

    <!-- Left Stem -->
    <rect x="218" y="135" width="18" height="175" rx="4" />
    <!-- Left Note Head -->
    <ellipse cx="200" cy="310" rx="34" ry="25" transform="rotate(-25 200 310)" />

    <!-- Right Stem -->
    <rect x="314" y="105" width="18" height="175" rx="4" />
    <!-- Right Note Head -->
    <ellipse cx="296" cy="280" rx="34" ry="25" transform="rotate(-25 296 280)" />

    <!-- Sound wave bars (Right) -->
    <rect x="356" y="141" width="18" height="230" rx="9" opacity="0.95" />
    <rect x="388" y="171" width="18" height="170" rx="9" opacity="0.9" />
    <rect x="420" y="216" width="18" height="80" rx="9" />
  </g>
</svg>
